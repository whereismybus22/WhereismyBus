<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HITAM Bus Support</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #f5f7fa;
        }

        .container {
            width: 90%;
            max-width: 420px;

            padding: 30px;

            text-align: center;

            background: #ffffff;

            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;

            color: #222;

            font-size: 26px;
        }

        p {
            color: #666;

            line-height: 1.5;
        }

        .gmail-button {
            margin-top: 20px;

            width: 100%;

            padding: 15px 20px;

            border: none;

            border-radius: 10px;

            background: #ea4335;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }

        .gmail-button:hover {
            background: #d93025;
        }

        .gmail-button:active {
            transform: scale(0.98);
        }

        .note {
            margin-top: 18px;

            font-size: 13px;

            color: #888;
        }
    </style>
</head>


<body>

    <div class="container">

        <h1>HITAM Bus Support</h1>

        <p>
            Facing an issue with your bus service?
            Contact us through Gmail.
        </p>


        <!-- Gmail Button -->

        <button
            type="button"
            class="gmail-button"
            onclick="openGmail()"
        >

            <span style="font-size: 26px;">
                ✉️
            </span>

            Contact via Gmail

        </button>


        <div class="note">
            Gmail will open with a pre-filled email.
        </div>

    </div>



    <script>

        /*
         * =========================================================
         * FUNCTION 1
         * DETECT MOBILE OPERATING SYSTEM
         * =========================================================
         */

        function getMobileOS() {

            const userAgent =
                navigator.userAgent ||
                navigator.vendor ||
                window.opera;


            /*
             * Android
             */

            if (/android/i.test(userAgent)) {
                return "Android";
            }


            /*
             * iPhone / iPad / iPod
             */

            if (
                /iPad|iPhone|iPod/i.test(userAgent) ||
                (
                    navigator.platform === "MacIntel" &&
                    navigator.maxTouchPoints > 1
                )
            ) {
                return "iOS";
            }


            /*
             * Other devices
             */

            return "Unknown";
        }



        /*
         * =========================================================
         * FUNCTION 2
         * CREATE EMAIL BODY
         * =========================================================
         */

        function createEmailBody() {

            const mobileOS = getMobileOS();


            const body =
`Name:
< please write your name, here >

Mobile number:
< please write your mobile number, here >

Mobile OS:
${mobileOS}

Institution:
HITAM

Route no:
< please write your bus route number, here >

Issue:
< please write your issue, here >`;


            return body;
        }



        /*
         * =========================================================
         * FUNCTION 3
         * OPEN GMAIL APP
         * =========================================================
         *
         * Android:
         * Uses Gmail's Android application deep-link.
         *
         * iOS:
         * Uses Gmail's iOS URL scheme.
         *
         * Fallback:
         * Uses mailto: if the app deep-link cannot be handled.
         */

        function openGmail() {

            const recipient =
                "whereismybus22@gmail.com";


            const subject =
                "Issue with app.";


            const body =
                createEmailBody();


            const encodedRecipient =
                encodeURIComponent(recipient);


            const encodedSubject =
                encodeURIComponent(subject);


            const encodedBody =
                encodeURIComponent(body);


            const userAgent =
                navigator.userAgent ||
                navigator.vendor ||
                window.opera;



            /*
             * =====================================================
             * ANDROID
             * =====================================================
             *
             * Gmail Android app uses the package:
             *
             * com.google.android.gm
             *
             * We use the Gmail-specific Android intent URI.
             */

            if (/android/i.test(userAgent)) {

                const androidGmailURL =
                    "intent://compose/" +
                    "?to=" + encodedRecipient +
                    "&subject=" + encodedSubject +
                    "&body=" + encodedBody +
                    "#Intent;" +
                    "scheme=gmail;" +
                    "package=com.google.android.gm;" +
                    "end";


                /*
                 * Try opening Gmail Android app.
                 */

                window.location.href = androidGmailURL;


                /*
                 * Fallback after a short delay.
                 *
                 * If Gmail is not installed or the intent
                 * cannot be handled, use mailto.
                 */

                setTimeout(function () {

                    openMailto(
                        recipient,
                        subject,
                        body
                    );

                }, 1500);


                return;
            }



            /*
             * =====================================================
             * iOS
             * =====================================================
             *
             * Gmail's iOS URL scheme:
             *
             * googlegmail://
             */

            if (
                /iPad|iPhone|iPod/i.test(userAgent) ||
                (
                    navigator.platform === "MacIntel" &&
                    navigator.maxTouchPoints > 1
                )
            ) {

                const iosGmailURL =
                    "googlegmail://co" +
                    "?to=" + encodedRecipient +
                    "&subject=" + encodedSubject +
                    "&body=" + encodedBody;


                /*
                 * Try Gmail iOS app.
                 */

                window.location.href = iosGmailURL;


                /*
                 * Fallback to mailto.
                 */

                setTimeout(function () {

                    openMailto(
                        recipient,
                        subject,
                        body
                    );

                }, 1500);


                return;
            }



            /*
             * =====================================================
             * DESKTOP / OTHER DEVICES
             * =====================================================
             */

            openMailto(
                recipient,
                subject,
                body
            );

        }



        /*
         * =========================================================
         * FUNCTION 4
         * MAILTO FALLBACK
         * =========================================================
         */

        function openMailto(
            recipient,
            subject,
            body
        ) {

            const mailtoURL =
                "mailto:" +
                recipient +
                "?subject=" +
                encodeURIComponent(subject) +
                "&body=" +
                encodeURIComponent(body);


            window.location.href = mailtoURL;
        }

    </script>

</body>

</html>
