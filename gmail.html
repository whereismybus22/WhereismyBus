<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HITAM - Contact Gmail</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #f5f7fa;
        }


        .container {
            width: 90%;
            max-width: 420px;

            padding: 30px;

            text-align: center;

            background: #ffffff;

            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);
        }


        h1 {
            margin: 0 0 15px 0;

            color: #222;

            font-size: 26px;
        }


        p {
            color: #666;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        .gmail-button {
            width: 100%;

            padding: 15px 20px;

            border: none;

            border-radius: 10px;

            background: #ea4335;

            color: #ffffff;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }


        .gmail-button:hover {
            background: #d93025;
        }


        .gmail-button:active {
            transform: scale(0.98);
        }


        .gmail-icon {
            width: 28px;
            height: 28px;
        }


        .note {
            margin-top: 18px;

            font-size: 13px;

            color: #888;
        }

    </style>

</head>


<body>


    <div class="container">

        <h1>HITAM Bus Support</h1>

        <p>
            Facing an issue with your bus service?
            Contact us through Gmail.
        </p>


        <button
            type="button"
            class="gmail-button"
            id="gmailButton"
        >

            <span style="font-size: 26px;">
                ✉️
            </span>

            Contact via Gmail

        </button>


        <div class="note">
            Gmail will open with a pre-filled email.
        </div>

    </div>



    <script>


        /*
         * =========================================================
         * SAFE AREA FOR PWA / STANDALONE MODE
         * =========================================================
         */

        if (
            window.matchMedia(
                '(display-mode: standalone)'
            ).matches
        ) {

            document.querySelector(
                '.container'
            ).style.paddingBottom =
                'env(safe-area-inset-bottom, 3px)';

        }



        /*
         * =========================================================
         * FUNCTION 1
         * DETECT MOBILE OPERATING SYSTEM
         * =========================================================
         */

        function getMobileOS() {

            const userAgent =
                navigator.userAgent ||
                navigator.vendor ||
                window.opera;


            /*
             * Android
             */

            if (/android/i.test(userAgent)) {

                return "Android";

            }


            /*
             * iPhone / iPad / iPod
             *
             * The second condition handles newer iPads
             * that may identify themselves as Macintosh.
             */

            if (
                /iPad|iPhone|iPod/i.test(userAgent) ||
                (
                    navigator.platform === "MacIntel" &&
                    navigator.maxTouchPoints > 1
                )
            ) {

                return "iOS";

            }


            /*
             * Other devices
             */

            return "Unknown";

        }



        /*
         * =========================================================
         * FUNCTION 2
         * CREATE EMAIL BODY
         * =========================================================
         */

        function createEmailBody() {

            const os = getMobileOS();


            const body =
`Name:
< please write your name, here >

Mobile number:
< please write your mobile number, here >

Mobile OS:
${os}

Institution:
HITAM

Route no:
< please write your bus route number, here >

Issue:
< please write your issue, here >`;


            return body;

        }



        /*
         * =========================================================
         * FUNCTION 3
         * FALLBACK TO NORMAL EMAIL APPLICATION
         * =========================================================
         */

        function openMailto(
            recipient,
            subject,
            body
        ) {

            const mailtoURL =
                "mailto:" +
                recipient +
                "?subject=" +
                encodeURIComponent(subject) +
                "&body=" +
                encodeURIComponent(body);


            window.location.href = mailtoURL;

        }



        /*
         * =========================================================
         * FUNCTION 4
         * OPEN GMAIL APP
         * =========================================================
         */

        function openGmail() {

            const recipient =
                "whereismybus22@gmail.com";


            const subject =
                "Issue with app.";


            const body =
                createEmailBody();


            const encodedRecipient =
                encodeURIComponent(recipient);


            const encodedSubject =
                encodeURIComponent(subject);


            const encodedBody =
                encodeURIComponent(body);


            const userAgent =
                navigator.userAgent ||
                navigator.vendor ||
                window.opera;



            /*
             * =====================================================
             * ANDROID
             * =====================================================
             *
             * Try Gmail's native Android URI.
             *
             * gmail://co
             * = Gmail compose
             */

            if (/android/i.test(userAgent)) {

                const gmailAndroidURL =
                    "gmail://co" +
                    "?to=" +
                    encodedRecipient +
                    "&subject=" +
                    encodedSubject +
                    "&body=" +
                    encodedBody;


                /*
                 * Try to open Gmail app.
                 */

                window.location.href =
                    gmailAndroidURL;


                /*
                 * If the browser/device does not allow
                 * the Gmail URI, fall back to mailto.
                 */

                setTimeout(function() {

                    openMailto(
                        recipient,
                        subject,
                        body
                    );

                }, 1500);


                return;

            }



            /*
             * =====================================================
             * iOS
             * =====================================================
             *
             * Gmail iOS uses:
             *
             * googlegmail://
             *
             * /co = compose
             */

            if (
                /iPad|iPhone|iPod/i.test(userAgent) ||
                (
                    navigator.platform === "MacIntel" &&
                    navigator.maxTouchPoints > 1
                )
            ) {

                const gmailIOSURL =
                    "googlegmail:///co" +
                    "?to=" +
                    encodedRecipient +
                    "&subject=" +
                    encodedSubject +
                    "&body=" +
                    encodedBody;


                /*
                 * Try to open Gmail app.
                 */

                window.location.href =
                    gmailIOSURL;


                /*
                 * Fallback if Gmail cannot be opened.
                 */

                setTimeout(function() {

                    openMailto(
                        recipient,
                        subject,
                        body
                    );

                }, 1500);


                return;

            }



            /*
             * =====================================================
             * DESKTOP / UNKNOWN DEVICE
             * =====================================================
             */

            openMailto(
                recipient,
                subject,
                body
            );

        }



        /*
         * =========================================================
         * BUTTON EVENT
         * =========================================================
         */

        document
            .getElementById("gmailButton")
            .addEventListener(
                "click",
                openGmail
            );

    </script>


</body>

</html>
