<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HITAM Bus Support - Gmail</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #f5f7fa;
        }


        .container {

            width: 90%;

            max-width: 420px;

            padding: 30px;

            text-align: center;

            background: #ffffff;

            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);
        }


        h1 {

            margin: 0 0 15px 0;

            color: #222;

            font-size: 26px;
        }


        p {

            color: #666;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        .gmail-button {

            width: 100%;

            padding: 15px 20px;

            border: none;

            border-radius: 10px;

            background: #ea4335;

            color: #ffffff;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }


        .gmail-button:hover {

            background: #d93025;
        }


        .gmail-button:active {

            transform: scale(0.98);
        }


        .gmail-icon {

            width: 28px;

            height: 28px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;
        }


        .note {

            margin-top: 18px;

            font-size: 13px;

            color: #888;
        }

    </style>

</head>


<body>


    <div class="container">

        <h1>
            HITAM Bus Support
        </h1>


        <p>
            Facing an issue with your bus service?
            Contact us through email.
        </p>


        <button
            type="button"
            class="gmail-button"
            id="gmailButton"
        >

            <span class="gmail-icon">
                ✉️
            </span>

            Contact via Gmail

        </button>


        <div class="note">
            Your email app will open with a pre-filled message.
        </div>

    </div>



    <script>


        /*
         * =========================================================
         * PWA SAFE AREA
         * =========================================================
         */

        if (
            window.matchMedia(
                '(display-mode: standalone)'
            ).matches
        ) {

            document.querySelector(
                '.container'
            ).style.paddingBottom =
                'env(safe-area-inset-bottom, 3px)';

        }



        /*
         * =========================================================
         * FUNCTION: GET MOBILE OS
         * =========================================================
         *
         * Returns:
         *
         * Android
         * iOS
         * Unknown
         *
         */

        function getMobileOS() {

            const userAgent =
                navigator.userAgent ||
                navigator.vendor ||
                window.opera;


            /*
             * Android
             */

            if (/android/i.test(userAgent)) {

                return "Android";

            }


            /*
             * iPhone / iPad / iPod
             */

            if (
                /iPad|iPhone|iPod/i.test(userAgent) ||
                (
                    navigator.platform === "MacIntel" &&
                    navigator.maxTouchPoints > 1
                )
            ) {

                return "iOS";

            }


            /*
             * Other devices
             */

            return "Unknown";

        }



        /*
         * =========================================================
         * FUNCTION: CREATE EMAIL BODY
         * =========================================================
         */

        function createEmailBody() {

            const os =
                getMobileOS();


            const body =
                'Name:\n' +
                '< please write your name, here >\n\n' +

                'Mobile number:\n' +
                '< please write your mobile number, here >\n\n' +

                'Mobile OS:\n' +
                os + '\n\n' +

                'Institution:\n' +
                'HITAM\n\n' +

                'Route no:\n' +
                '< please write your bus route number, here >\n\n' +

                'Issue:\n' +
                '< please write your issue, here >';


            return body;

        }



        /*
         * =========================================================
         * FUNCTION: OPEN EMAIL APPLICATION
         * =========================================================
         *
         * mailto: is the standard way for a website to
         * request the operating system's email application.
         *
         * If Gmail is configured as the email handler,
         * Gmail will open.
         *
         */

        function openGmail() {

            const recipient =
                'whereismybus22@gmail.com';


            const subject =
                'Issue with app.';


            const body =
                createEmailBody();


            /*
             * Build mailto URL
             */

            const mailtoLink =
                'mailto:' +
                recipient +
                '?subject=' +
                encodeURIComponent(subject) +
                '&body=' +
                encodeURIComponent(body);


            /*
             * Open the email application
             */

            window.location.href =
                mailtoLink;

        }



        /*
         * =========================================================
         * BUTTON CLICK EVENT
         * =========================================================
         */

        document
            .getElementById('gmailButton')
            .addEventListener(
                'click',
                openGmail
            );

    </script>


</body>

</html>
