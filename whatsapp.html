<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HITAM Bus Support</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 30px;
            text-align: center;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;
            color: #222;
            font-size: 26px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        .whatsapp-button {
            margin-top: 20px;
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            background: #25D366;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .whatsapp-button:hover {
            background: #1ebe5d;
        }

        .whatsapp-button:active {
            transform: scale(0.98);
        }

        .whatsapp-icon {
            width: 28px;
            height: 28px;
        }

        .note {
            margin-top: 18px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>HITAM Bus Support</h1>

        <p>
            Facing an issue with your bus service?
            Contact us through WhatsApp.
        </p>

        <button
            type="button"
            class="whatsapp-button"
            onclick="openWhatsApp()"
        >
            <span>💬</span>
            Contact on WhatsApp
        </button>

        <div class="note">
            WhatsApp will open with a pre-filled message.
        </div>

    </div>


    <script>

        /*
         * Detect the user's mobile operating system.
         *
         * Returns:
         *     "Android"
         *     "iOS"
         *     "Unknown"
         */
        function getMobileOS() {

            const userAgent =
                navigator.userAgent ||
                navigator.vendor ||
                window.opera;


            // Android
            if (/android/i.test(userAgent)) {
                return "Android";
            }


            // iPhone / iPad / iPod
            if (
                /iPad|iPhone|iPod/.test(userAgent) ||
                (
                    navigator.platform === "MacIntel" &&
                    navigator.maxTouchPoints > 1
                )
            ) {
                return "iOS";
            }


            // Other devices
            return "Unknown";
        }


        /*
         * Open WhatsApp with a pre-filled message.
         */
        function openWhatsApp() {

            // Automatically detect operating system
            const mobileOS = getMobileOS();


            // WhatsApp message
            const message =
`Name        : < please write your name, here >
Mobile OS   : ${mobileOS}
Institution : HITAM
Route no    : < please write your bus route number, here >
Issue       : < please write your issue, here >`;


            // WhatsApp phone number.
            // India country code (+91) is included.
            const phoneNumber = "919010025943";


            // Create WhatsApp URL
            const whatsappURL =
                "https://wa.me/" +
                phoneNumber +
                "?text=" +
                encodeURIComponent(message);


            // Open WhatsApp
            window.location.href = whatsappURL;
        }

    </script>

</body>
</html>
