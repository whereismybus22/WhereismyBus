<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Important for Android and iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HITAM Bus Support</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #f5f7fa;
        }

        .container {
            width: 90%;
            max-width: 420px;

            padding: 30px;

            text-align: center;

            background: #ffffff;

            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;

            color: #222;

            font-size: 26px;
        }

        p {
            color: #666;

            line-height: 1.5;
        }

        .whatsapp-button {
            margin-top: 20px;

            width: 100%;

            padding: 15px 20px;

            border: none;

            border-radius: 10px;

            background: #25D366;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }

        .whatsapp-button:hover {
            background: #1ebe5d;
        }

        .whatsapp-button:active {
            transform: scale(0.98);
        }

        .whatsapp-icon {
            width: 28px;
            height: 28px;
        }

        .note {
            margin-top: 18px;

            font-size: 13px;

            color: #888;
        }
    </style>
</head>


<body>

    <div class="container">

        <h1>HITAM Bus Support</h1>

        <p>
            Facing an issue with your bus service?
            Contact us through WhatsApp.
        </p>


        <!-- WhatsApp Button -->

        <button
            type="button"
            class="whatsapp-button"
            onclick="openWhatsApp()"
        >

            <!-- WhatsApp icon -->
            <span style="font-size: 26px;">💬</span>

            Contact on WhatsApp

        </button>


        <div class="note">
            WhatsApp will open with a pre-filled message.
        </div>

    </div>



    <script>

        /*
         * =========================================================
         * FUNCTION 1: DETECT MOBILE OPERATING SYSTEM
         * =========================================================
         *
         * Returns:
         *
         * Android
         * iOS
         * Unknown
         *
         */

        function getMobileOS() {

            const userAgent =
                navigator.userAgent ||
                navigator.vendor ||
                window.opera;


            /*
             * Check for Android
             */

            if (/android/i.test(userAgent)) {

                return "Android";

            }


            /*
             * Check for iPhone / iPad / iPod
             *
             * The MacIntel + maxTouchPoints check is included
             * because newer iPads can sometimes identify
             * themselves as Macintosh.
             */

            if (
                /iPad|iPhone|iPod/.test(userAgent) ||
                (
                    navigator.platform === "MacIntel" &&
                    navigator.maxTouchPoints > 1
                )
            ) {

                return "iOS";

            }


            /*
             * If the device is not Android or iOS
             */

            return "Unknown";
        }



        /*
         * =========================================================
         * FUNCTION 2: OPEN WHATSAPP
         * =========================================================
         *
         * This function:
         *
         * 1. Detects the user's operating system.
         * 2. Creates the WhatsApp message.
         * 3. Adds the mobile OS automatically.
         * 4. Opens WhatsApp chat with the specified number.
         *
         */

        function openWhatsApp() {


            /*
             * Get user's operating system
             */

            const mobileOS = getMobileOS();



            /*
             * Create WhatsApp message.
             *
             * WhatsApp uses:
             *
             * *text*
             *
             * for bold text.
             */

            const message =
`*Name:*
< please write your name, here >

*Mobile OS:*
${mobileOS}

*Institution:*
HITAM

*Route no:*
< please write your bus route number, here >

*Issue:*
< please write your issue, here >`;



            /*
             * WhatsApp number.
             *
             * 91 = India country code
             *
             * 9010025943 = mobile number
             */

            const phoneNumber = "919010025943";



            /*
             * Create WhatsApp Click-to-Chat URL
             */

            const whatsappURL =
                "https://wa.me/" +
                phoneNumber +
                "?text=" +
                encodeURIComponent(message);



            /*
             * Open WhatsApp
             */

            window.location.href = whatsappURL;

        }

    </script>

</body>

</html>
