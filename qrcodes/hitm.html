<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Please Visit After September 1st</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 40%, #24204a 0%, #0d0b1d 45%, #03030a 100%);
      font-family: "Segoe UI", sans-serif;
      color: white;
    }

    /* Ambient glow */
    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: #8b5cf6;
      filter: blur(140px);
      opacity: 0.18;
      animation: breathe 5s ease-in-out infinite alternate;
    }

    @keyframes breathe {
      from {
        transform: scale(0.8);
        opacity: 0.12;
      }
      to {
        transform: scale(1.2);
        opacity: 0.25;
      }
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 30px;
    }

    .small-text {
      opacity: 0;
      font-size: 1rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #b8b1d9;
      animation: fadeUp 1.5s ease forwards;
      animation-delay: 0.4s;
    }

    h1 {
      margin-top: 20px;
      font-size: clamp(3rem, 9vw, 8rem);
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: -4px;

      background: linear-gradient(
        90deg,
        #fff,
        #c4b5fd,
        #ffffff,
        #a78bfa,
        #fff
      );
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      opacity: 0;
      transform: translateY(40px) scale(0.95);

      animation:
        reveal 1.5s cubic-bezier(.2,.8,.2,1) forwards,
        shine 5s linear infinite;

      animation-delay: 1s, 2.5s;
    }

    .date {
      margin-top: 30px;
      font-size: clamp(1.2rem, 3vw, 2rem);
      color: #ddd6fe;
      letter-spacing: 4px;

      opacity: 0;
      animation: fadeUp 1.5s ease forwards;
      animation-delay: 2s;
    }

    .line {
      width: 0;
      height: 2px;
      margin: 35px auto 0;
      background: linear-gradient(90deg, transparent, #a78bfa, transparent);

      animation: lineGrow 1.5s ease forwards;
      animation-delay: 2.5s;
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shine {
      0% {
        background-position: 0% center;
      }
      100% {
        background-position: 300% center;
      }
    }

    @keyframes lineGrow {
      to {
        width: min(500px, 80vw);
      }
    }

    /* Floating particles */
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: float linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      15% {
        opacity: 0.8;
      }
      85% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <div class="container">
    <div class="small-text">Work in progress</div>

    <h1>Please Visit</h1>

    <div class="date">AFTER SEPTEMBER 1ST</div>

    <div class="line"></div>
  </div>

  <script>
    // Create beautiful floating particles
    for (let i = 0; i < 80; i++) {
      const particle = document.createElement("div");
      particle.className = "particle";

      particle.style.left = Math.random() * 100 + "vw";
      particle.style.animationDuration = (5 + Math.random() * 10) + "s";
      particle.style.animationDelay = Math.random() * 10 + "s";
      particle.style.opacity = Math.random();

      const size = 1 + Math.random() * 3;
      particle.style.width = size + "px";
      particle.style.height = size + "px";

      document.body.appendChild(particle);
    }
  </script>

</body>
</html>
