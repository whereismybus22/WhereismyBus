<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Please Visit After September 5th</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Segoe UI", Arial, sans-serif;
      color: white;

      background:
        radial-gradient(
          circle at 50% 45%,
          #292052 0%,
          #15102d 30%,
          #090718 60%,
          #020208 100%
        );
    }

    /* =========================================================
       MAIN AMBIENT GLOW
       ========================================================= */

    .glow {
      position: absolute;

      width: 550px;
      height: 550px;

      border-radius: 50%;

      background: #8b5cf6;

      filter: blur(150px);

      opacity: 0.15;

      animation:
        breathe 6s ease-in-out infinite alternate,
        glowPulse 8s ease-in-out infinite;
    }

    @keyframes breathe {
      0% {
        transform: scale(0.75);
        opacity: 0.10;
      }

      50% {
        opacity: 0.18;
      }

      100% {
        transform: scale(1.25);
        opacity: 0.28;
      }
    }

    @keyframes glowPulse {
      0%,
      100% {
        filter: blur(150px);
      }

      50% {
        filter: blur(180px);
      }
    }


    /* =========================================================
       SUBTLE ROTATING RINGS
       ========================================================= */

    .ring {
      position: absolute;

      width: 650px;
      height: 650px;

      border-radius: 50%;

      border: 1px solid rgba(167, 139, 250, 0.07);

      animation: rotate 30s linear infinite;
    }

    .ring::before {
      content: "";

      position: absolute;

      inset: 45px;

      border-radius: 50%;

      border: 1px solid rgba(167, 139, 250, 0.045);
    }

    .ring::after {
      content: "";

      position: absolute;

      inset: 100px;

      border-radius: 50%;

      border: 1px solid rgba(196, 181, 253, 0.025);
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    /* =========================================================
       MAIN CONTENT
       ========================================================= */

    .container {
      position: relative;

      z-index: 10;

      width: min(1000px, 90vw);

      text-align: center;

      padding: 30px;
    }


    /* =========================================================
       SMALL INTRO TEXT
       ========================================================= */

    .small-text {
      font-size: clamp(0.7rem, 1.5vw, 1rem);

      letter-spacing: 7px;

      text-transform: uppercase;

      color: #c4b5fd;

      opacity: 0;

      transform: translateY(25px);

      animation:
        fadeUp 1.5s cubic-bezier(.2,.8,.2,1) forwards;

      animation-delay: 0.4s;

      text-shadow:
        0 0 20px rgba(167, 139, 250, 0.25);
    }


    /* =========================================================
       MAIN HEADING
       ========================================================= */

    h1 {
      margin-top: 25px;

      font-size: clamp(3.2rem, 9vw, 8rem);

      line-height: 0.95;

      font-weight: 800;

      letter-spacing: -4px;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #ddd6fe,
          #ffffff,
          #a78bfa,
          #ffffff,
          #c4b5fd,
          #ffffff
        );

      background-size: 400% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      opacity: 0;

      transform:
        translateY(50px)
        scale(0.92);

      animation:
        reveal 1.6s cubic-bezier(.2,.8,.2,1) forwards,
        shine 7s linear infinite;

      animation-delay:
        0.9s,
        2.5s;

      text-shadow:
        0 0 50px rgba(167, 139, 250, 0.12);
    }


    /* =========================================================
       DATE TEXT
       ========================================================= */

    .date {
      margin-top: 35px;

      font-size: clamp(1.1rem, 3vw, 2rem);

      font-weight: 500;

      color: #ddd6fe;

      letter-spacing: 5px;

      opacity: 0;

      transform: translateY(25px);

      animation:
        fadeUp 1.5s cubic-bezier(.2,.8,.2,1) forwards;

      animation-delay: 1.9s;

      text-shadow:
        0 0 20px rgba(167, 139, 250, 0.35),
        0 0 50px rgba(139, 92, 246, 0.15);
    }


    /* =========================================================
       ANIMATED LINE
       ========================================================= */

    .line {
      position: relative;

      width: 0;

      height: 2px;

      margin: 38px auto 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          #8b5cf6,
          #ffffff,
          #a78bfa,
          transparent
        );

      box-shadow:
        0 0 12px rgba(167, 139, 250, 0.6),
        0 0 30px rgba(139, 92, 246, 0.25);

      animation:
        lineGrow 1.6s cubic-bezier(.2,.8,.2,1) forwards;

      animation-delay: 2.4s;
    }

    /* Moving light across the line */

    .line::after {
      content: "";

      position: absolute;

      top: -3px;
      left: -20%;

      width: 20%;
      height: 8px;

      background: rgba(255, 255, 255, 0.8);

      filter: blur(5px);

      animation: lineLight 3s ease-in-out infinite;

      animation-delay: 4s;
    }


    /* =========================================================
       SUBTEXT
       ========================================================= */

    .subtext {
      margin-top: 24px;

      font-size: 0.75rem;

      letter-spacing: 5px;

      text-transform: uppercase;

      color: rgba(196, 181, 253, 0.45);

      opacity: 0;

      animation:
        fadeIn 2s ease forwards;

      animation-delay: 3s;
    }


    /* =========================================================
       ANIMATIONS
       ========================================================= */

    @keyframes reveal {
      0% {
        opacity: 0;

        transform:
          translateY(50px)
          scale(0.92);

        filter: blur(10px);
      }

      70% {
        filter: blur(0);
      }

      100% {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);

        filter: blur(0);
      }
    }


    @keyframes fadeUp {
      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }


    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }


    @keyframes shine {
      0% {
        background-position: 0% center;
      }

      100% {
        background-position: 400% center;
      }
    }


    @keyframes lineGrow {
      to {
        width: min(600px, 78vw);
      }
    }


    @keyframes lineLight {
      0% {
        left: -20%;
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      70% {
        opacity: 0.8;
      }

      100% {
        left: 100%;
        opacity: 0;
      }
    }


    /* =========================================================
       FLOATING PARTICLES
       ========================================================= */

    .particle {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: #ffffff;

      box-shadow:
        0 0 8px #a78bfa,
        0 0 15px rgba(167, 139, 250, 0.8);

      opacity: 0;

      animation: float linear infinite;
    }

    @keyframes float {
      0% {
        transform:
          translateY(110vh)
          translateX(0)
          scale(0);

        opacity: 0;
      }

      15% {
        opacity: 0.8;
      }

      50% {
        transform:
          translateY(50vh)
          translateX(30px)
          scale(1);
      }

      85% {
        opacity: 0.5;
      }

      100% {
        transform:
          translateY(-10vh)
          translateX(-30px)
          scale(0.5);

        opacity: 0;
      }
    }


    /* =========================================================
       SOFT VIGNETTE
       ========================================================= */

    .vignette {
      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: 20;

      background:
        radial-gradient(
          circle,
          transparent 40%,
          rgba(0, 0, 0, 0.25) 100%
        );
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      .ring {
        width: 420px;
        height: 420px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .date {
        letter-spacing: 3px;
      }

      .small-text {
        letter-spacing: 4px;
      }

      .subtext {
        letter-spacing: 3px;
      }
    }
  </style>
</head>


<body>

  <!-- Ambient background glow -->
  <div class="glow"></div>

  <!-- Subtle animated rings -->
  <div class="ring"></div>

  <!-- Main content -->
  <div class="container">

    <div class="small-text">
      Work in progress
    </div>

    <h1>
      Please Visit
    </h1>

    <div class="date">
      AFTER SEPTEMBER 1ST
    </div>

    <div class="line"></div>

    <div class="subtext">
      We'll see you soon
    </div>

  </div>

  <!-- Cinematic vignette -->
  <div class="vignette"></div>


  <script>

    /*
     * ============================================================
     * BEAUTIFUL FLOATING PARTICLES
     * ============================================================
     */

    const particleCount = 100;

    for (let i = 0; i < particleCount; i++) {

      const particle = document.createElement("div");

      particle.className = "particle";

      /*
       * Random horizontal position
       */
      particle.style.left =
        Math.random() * 100 + "vw";

      /*
       * Random animation speed
       */
      particle.style.animationDuration =
        (6 + Math.random() * 12) + "s";

      /*
       * Random starting delay
       */
      particle.style.animationDelay =
        Math.random() * 12 + "s";

      /*
       * Random particle size
       */
      const size =
        1 + Math.random() * 3;

      particle.style.width =
        size + "px";

      particle.style.height =
        size + "px";

      /*
       * Random purple/white particle colors
       */
      const colors = [
        "#ffffff",
        "#c4b5fd",
        "#a78bfa",
        "#ddd6fe"
      ];

      particle.style.background =
        colors[Math.floor(Math.random() * colors.length)];

      document.body.appendChild(particle);
    }

  </script>

</body>
</html>
