<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhereismyBus - Official Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #2563eb);
      color: white;
      text-align: center;
    }

    .container {
      padding: 40px 24px;
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      margin-bottom: 16px;
    }

    p {
      font-size: 1.2rem;
      color: #dbeafe;
    }

    .badge {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 999px;
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">🚌</div>
    <h1>Hello!</h1>
    <p>This is the official website of <strong>WhereismyBus</strong>.</p>
    <div class="badge">Where is my bus? 🚍</div>
  </main>
</body>
</html>
